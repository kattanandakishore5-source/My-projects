{% extends 'shop/basic.html' %}
{% block title%} My Awesome Cart Tracker{% endblock %}
{% block body %}
<div class="store-container mt-4">
    <div class="row">

        <div class="col-md-5 mb-4 mb-md-0 pr-lg-4">
            <div class="content-card-store h-100">
                <h3 class="text-primary mb-4 font-weight-bold">Track Your Order</h3>
                <form method="post" action="#" id="trackerForm">{% csrf_token %}
                    <div class="form-group mb-3">
                        <label for="orderId" class="store-label">Order ID</label>
                        <input type="text" class="form-control store-input" id="orderId" name="orderId"
                            placeholder="e.g. 12345">
                    </div>
                    <div class="form-group mb-4">
                        <label for="email" class="store-label">Email Address</label>
                        <input type="email" class="form-control store-input" id="email" name="email"
                            placeholder="Email used for purchase">
                    </div>
                    <button type="submit" class="btn btn-cta w-100 py-3">Track Order</button>
                </form>
            </div>
        </div>

        <div class="col-md-7">
            <div class="content-card-store h-100">
                <h3 class="text-primary mb-4 font-weight-bold">Status History</h3>
                <div class="store-list-group">
                    <ul class="list-group" id="items">
                        <li
                            class="store-list-item d-flex justify-content-between align-items-center border-0 px-0 text-secondary">
                            Enter your Order Id and Email to track your order details
                        </li>
                    </ul>
                </div>

                <h3 class="text-primary mb-4 mt-5 font-weight-bold">Order Details</h3>
                <div class="store-list-group">
                    <ul class="list-group" id="citems">
                        <!-- Items rendered via JS -->
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block js %}
{% load static %}
<script src="{% static 'shop/js/tracker.js' %}"></script>
{% endblock %}
