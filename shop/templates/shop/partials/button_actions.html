{% if i.cart_qty %}
<div class="quantity-controls mb-2">
    <button class="btn-qty" data-product-id="{{ i.id }}" data-action="decrement" aria-label="Decrease quantity">&minus;</button>
    <span class="font-weight-bold text-white qty-display">{{ i.cart_qty }}</span>
    <button class="btn-qty" data-product-id="{{ i.id }}" data-action="increment" aria-label="Increase quantity">+</button>
</div>
{% else %}
<button class="btn btn-primary w-100 btn-add-cart mb-2" data-product-id="{{ i.id }}">Add To Cart</button>
{% endif %}

<div class="d-flex w-100 mt-2" style="gap: 8px;">
    <a href="/shop/products/{{ i.id }}" class="w-100" style="flex: 1;">
        <button type="button" class="btn btn-secondary w-100">View</button>
    </a>
</div>
