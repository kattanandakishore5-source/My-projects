{% if i.cart_qty %}
<div class="quantity-controls mb-2">
    <form hx-post="{% url 'UpdateCartItem' i.id 'decrement' %}" hx-target="closest .cart-action" hx-swap="innerHTML" hx-indicator=".htmx-indicator" class="m-0">
        {% csrf_token %}
        <button type="submit">- <span class="htmx-indicator spinner-border spinner-border-sm" role="status" aria-hidden="true"></span></button>
    </form>

    <span class="font-weight-bold text-white">{{ i.cart_qty }}</span>

    <form hx-post="{% url 'UpdateCartItem' i.id 'increment' %}" hx-target="closest .cart-action" hx-swap="innerHTML" hx-indicator=".htmx-indicator" class="m-0">
        {% csrf_token %}
        <button type="submit">+ <span class="htmx-indicator spinner-border spinner-border-sm" role="status" aria-hidden="true"></span></button>
    </form>
</div>
{% else %}
<form hx-post="{% url 'AddToCart' i.id %}" hx-target="closest .cart-action" hx-swap="innerHTML" hx-indicator=".htmx-indicator" class="mb-2 w-100">
    {% csrf_token %}
    <button type="submit" class="btn btn-primary w-100">Add To Cart <span class="htmx-indicator spinner-border spinner-border-sm" role="status" aria-hidden="true"></span></button>
</form>
{% endif %}

<div class="d-flex w-100 mt-2" style="gap: 8px;">
    <a href="/shop/products/{{ i.id }}" class="w-100" style="flex: 1;">
        <button type="button" class="btn btn-secondary w-100">View</button>
    </a>
</div>
{% if is_htmx %}
<span id="cart_count" class="cart-badge ml-1" hx-swap-oob="true">{{ cart_items }}</span>
{% endif %}
