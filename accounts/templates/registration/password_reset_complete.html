{% extends 'shop/basic.html' %}
{% block title %} Password Reset Complete - My Awesome Cart {% endblock %}

{% block body %}
<div class="store-container my-5">
    <div class="content-card-store mx-auto" style="max-width: 500px;">
        <div class="text-center mb-4">
            <h2 class="text-primary font-weight-bold">Password Reset Complete</h2>
            <div class="my-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="text-success" viewBox="0 0 16 16">
                    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                </svg>
            </div>
            <p class="text-secondary">Your password has been successfully reset. You can now log in with your new password.</p>
        </div>
        <a href="{% url 'login' %}" class="btn btn-cta w-100 py-3">Login</a>
    </div>
</div>
{% endblock %}
